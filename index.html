<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        header{
            display: flex;
            justify-content: space-between;
            margin: 8px 1rem;
        }

        .menu-horizontal {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 80%;
            gap: min(5px);
        }

        main {
            display: flex;
            justify-content: space-between;
            margin: 8px;
        }

        .text-content {
            width: 50%;
            padding: 1rem;
        }

        .foto-content {
            width: 50%;
            padding: 1rem;
        }
    </style>
</head>
<body>
    <header>
        <p>logo da empresa</p>
        <div class="menu-horizontal">
            <a href="#">Início</a>
            <a href="#">Sobre</a>
            <a href="#">Método</a>
            <a href="#">Preços</a>
            <a href="#">Contato</a>
        </div>
    </header>
    <main>
        <div class="text-content">
            <h1>Domine Inglês com o método das estrelas</h1>
            <p>Aprenda inglês  de forma prática, humana e acessível. Aulas personalizadas que transformam a sua fluência e abrem portas para o mundo!</p>
            <div class="botoes-main-text">
                <button>Inscrea-se agora</button>
                <button>Conheça o Professor</button>
            </div>
        </div>
        <div class="foto-content">
            <img src="" alt="Imagem do professor do curso de inglês">
        </div>
    </main>
</body>
</html>
